<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Editar Cliente</title>

    {% load static %}
    <link rel="stylesheet" href="{% static 'ferramentas/style.css' %}">

    <style>
        .form-wrap { max-width: 720px; background:#fff; border:1px solid #ddd; border-radius:12px; padding:16px; }
        .row { display:grid; gap:6px; margin-bottom: 12px; }
        .grid { display:grid; grid-template-columns: 1fr 1fr; gap:12px; }
        label { font-size: 13px; color:#444; }
        input, textarea { padding: 10px; border:1px solid #bbb; border-radius: 8px; font-size: 14px; width:100%; }
        textarea { min-height: 90px; }
        .actions { display:flex; gap:10px; align-items:center; margin-top: 8px; }
        .note { font-size: 12px; color:#666; margin-top: 8px; }
    </style>
</head>
<body>

<h1>Editar Cliente</h1>

<div class="top-actions">
    <a class="btn" href="{% url 'listar_clientes' %}">Voltar</a>
</div>

<div class="form-wrap">
    <form method="post">
        {% csrf_token %}

        <div class="row">
            <label>Nome</label>
            <input type="text" name="nome" value="{{ cliente.nome }}" required>
        </div>

        <div class="grid">
            <div class="row">
                <label>CPF/CNPJ</label>
                <input type="text" name="cpf_cnpj" value="{{ cliente.cpf_cnpj }}" required>
            </div>

            <div class="row">
                <label>Telefone</label>
                <input type="text" name="telefone" value="{{ cliente.telefone }}" required>
            </div>
        </div>

        <div class="row">
            <label>E-mail</label>
            <input type="email" name="email" value="{{ cliente.email }}">
        </div>

        <div class="row">
            <label>Endereço</label>
            <textarea name="endereco">{{ cliente.endereco }}</textarea>
        </div>

        <div class="row">
            <label>
                <input type="checkbox" name="ativo" {% if cliente.ativo %}checked{% endif %}>
                Cliente ativo
            </label>
            <div class="note">
                Se desativar, ele não aparece para nova locação.
            </div>
        </div>

        <div class="actions">
            <button class="btn" type="submit">Salvar</button>
            <a class="btn" href="{% url 'listar_clientes' %}">Cancelar</a>
        </div>
    </form>
</div>

</body>
</html>
