<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Editar Ferramenta</title>

    {% load static %}
    <link rel="stylesheet" href="{% static 'ferramentas/style.css' %}">

    <style>
        .form-wrap { max-width: 680px; background:#fff; border:1px solid #ddd; border-radius:12px; padding:16px; }
        .grid { display:grid; grid-template-columns: 1fr 1fr; gap:12px; }
        .row { display:grid; gap:6px; margin-bottom: 12px; }
        label { font-size: 13px; color:#444; }
        input, textarea { padding: 10px; border:1px solid #bbb; border-radius: 8px; font-size: 14px; width:100%; }
        textarea { min-height: 90px; }
        .actions { display:flex; gap:10px; align-items:center; margin-top: 8px; }
        .note { font-size: 12px; color:#666; margin-top: 8px; }
    </style>
</head>
<body>

<h1>Editar Ferramenta</h1>

<div class="top-actions">
    <a class="btn" href="{% url 'listar_ferramentas' %}">Voltar</a>
</div>

<div class="form-wrap">
    <form method="post">
        {% csrf_token %}

        <div class="row">
            <label>Nome</label>
            <input type="text" name="nome" value="{{ ferramenta.nome }}" required>
        </div>

        <div class="row">
            <label>Categoria</label>
            <input type="text" name="categoria" value="{{ ferramenta.categoria }}" required>
        </div>

        <div class="row">
            <label>Descrição</label>
            <textarea name="descricao">{{ ferramenta.descricao }}</textarea>
        </div>

        <div class="grid">
            <div class="row">
                <label>Valor diária</label>
                <input type="number" step="0.01" name="valor_diaria" value="{{ ferramenta.valor_diaria }}" required>
            </div>
            <div class="row">
                <label>Valor semanal</label>
                <input type="number" step="0.01" name="valor_semanal" value="{{ ferramenta.valor_semanal }}" required>
            </div>
        </div>

        <div class="grid">
            <div class="row">
                <label>Valor mensal</label>
                <input type="number" step="0.01" name="valor_mensal" value="{{ ferramenta.valor_mensal }}" required>
            </div>
            <div class="row">
                <label>Quantidade total</label>
                <input type="number" min="0" name="quantidade_total" value="{{ ferramenta.quantidade_total }}" required>
            </div>
        </div>

        <div class="row">
            <label>
                <input type="checkbox" name="ativa" {% if ferramenta.ativa %}checked{% endif %}>
                Ferramenta ativa
            </label>
            <div class="note">
                Disponível atual: <b>{{ ferramenta.quantidade_disponivel }}</b>
            </div>
        </div>

        <div class="actions">
            <button class="btn" type="submit">Salvar</button>
            <a class="btn" href="{% url 'listar_ferramentas' %}">Cancelar</a>
        </div>
    </form>
</div>

</body>
</html>
