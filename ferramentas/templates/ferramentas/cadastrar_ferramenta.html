<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Nova Ferramenta</title>
</head>
<body>

<h1>Cadastrar Ferramenta</h1>

{% if form.non_field_errors %}
    <ul>
    {% for err in form.non_field_errors %}
        <li>{{ err }}</li>
    {% endfor %}
    </ul>
{% endif %}

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Salvar</button>
</form>

<a href="{% url 'home' %}">Voltar</a>

</body>
</html>
