<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Ferramenta</title>

    {% load static %}
    <link rel="stylesheet" href="{% static 'ferramentas/style.css' %}">

    <style>
        .form-wrap { max-width: 720px; background:#fff; border:1px solid #ddd; border-radius:12px; padding:16px; }
        .row { display:grid; gap:6px; margin-bottom: 12px; }
        .grid { display:grid; grid-template-columns: 1fr 1fr; gap:12px; }
        label { font-size: 13px; color:#444; }
        input, textarea { padding: 10px; border:1px solid #bbb; border-radius: 8px; font-size: 14px; width:100%; }
        textarea { min-height: 90px; }
        .actions { display:flex; gap:10px; align-items:center; margin-top: 8px; }
        .hint { font-size: 12px; color:#666; margin-top: 6px; }
    </style>
</head>
<body>

<h1>Cadastrar Ferramenta</h1>

<div class="top-actions">
    <a class="btn" href="{% url 'home' %}">Voltar</a>
</div>

<div class="form-wrap">
    <form method="post">
        {% csrf_token %}

        <div class="row">
            <label for="nome">Nome</label>
            <input id="nome" type="text" name="nome" placeholder="Ex: Betoneira 400L" required>
        </div>

        <div class="row">
            <label for="categoria">Categoria</label>
            <input id="categoria" type="text" name="categoria" placeholder="Ex: Concretagem" required>
        </div>

        <div class="row">
            <label for="descricao">Descrição</label>
            <textarea id="descricao" name="descricao" placeholder="Detalhes, observações, marca, potência, etc."></textarea>
        </div>

        <div class="grid">
            <div class="row">
                <label for="valor_diaria">Valor diária (R$)</label>
                <input id="valor_diaria" type="number" step="0.01" min="0" name="valor_diaria" placeholder="Ex: 50.00" required>
            </div>

            <div class="row">
                <label for="valor_semanal">Valor semanal (R$)</label>
                <input id="valor_semanal" type="number" step="0.01" min="0" name="valor_semanal" placeholder="Ex: 250.00" required>
            </div>
        </div>

        <div class="grid">
            <div class="row">
                <label for="valor_mensal">Valor mensal (R$)</label>
                <input id="valor_mensal" type="number" step="0.01" min="0" name="valor_mensal" placeholder="Ex: 800.00" required>
            </div>

            <div class="row">
                <label for="quantidade_total">Quantidade total</label>
                <input id="quantidade_total" type="number" min="0" name="quantidade_total" placeholder="Ex: 3" required>
                <div class="hint">A quantidade disponível começa igual à quantidade total.</div>
            </div>
        </div>

        <div class="actions">
            <button class="btn" type="submit">Salvar</button>
            <a class="btn" href="{% url 'home' %}">Cancelar</a>
        </div>
    </form>
</div>

</body>
</html>
